name: Publish research frontend
on:
  push:
    branches: [main]
    paths: [index.html, assets/**, results/**, .github/workflows/pages.yml]
  workflow_dispatch:
  workflow_run:
    workflows: [Monthly analysis]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Stage public frontend and aggregate results
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets results _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
