[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-review-sentiment"
version = "2.0.0"
description = "Sentiment methods for MyAnimeList reviews, checked against the reviewers' own verdicts"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy",
  "scikit-learn>=1.3",
  "matplotlib",
  "openpyxl",
  "textblob",
  "vaderSentiment",
]

[project.optional-dependencies]
model = ["transformers>=4.40", "torch"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
